name: Release

# Runs when scripts/release.sh pushes a version tag. Verifies that the tag,
# pubspec.yaml and CHANGELOG.md agree, runs CI, and creates the GitHub
# release from the CHANGELOG section. Publishing to pub.dev is handled by
# publish.yml.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          cache: true
      - name: Verify tag matches pubspec.yaml and CHANGELOG.md
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
          grep -q "^## $version\$" CHANGELOG.md || { echo "::error::No CHANGELOG entry for $version"; exit 1; }
      - run: ./scripts/ci.sh --test --package
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
