include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Flutter 3.48+ deprecates package:flutter/material.dart in favor of
    # package:material_ui, which is unavailable on the minimum supported
    # Flutter (3.27). Revisit when the minimum SDK is raised.
    deprecated_member_use: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - directives_ordering
    - unawaited_futures
